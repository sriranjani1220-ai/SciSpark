<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SciSpark - Kids Science Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      background: #0b0c2a;
      min-height: 100vh;
      color: #fff;
      overflow-x: hidden;
    }

    /* ── Star canvas background ─────────────────────── */
    #star-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Screens ────────────────────────────────────── */
    .screen { display: none; position: relative; z-index: 1; min-height: 100vh; }
    .screen.active { display: block; }

    /* ══════════════════════════════════════════════════
       HOME SCREEN
    ══════════════════════════════════════════════════ */
    #screen-home { padding: 20px 16px 60px; }

    .home-header {
      text-align: center;
      padding: 36px 20px 28px;
      position: relative;
    }

    .age-widget {
      position: absolute;
      top: 14px;
      left: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,.07);
      border: 2px solid rgba(255,215,0,.35);
      border-radius: 20px;
      padding: 12px 16px 10px;
      box-shadow: 0 4px 24px rgba(255,215,0,.15);
      min-width: 90px;
    }

    .age-widget-emoji {
      font-size: 1.9rem;
      animation: age-bounce 1.1s ease-in-out infinite alternate;
      line-height: 1;
    }

    @keyframes age-bounce {
      0%   { transform: translateY(0) rotate(-8deg) scale(1); }
      40%  { transform: translateY(-6px) rotate(6deg) scale(1.12); }
      100% { transform: translateY(0) rotate(-4deg) scale(1); }
    }

    .age-widget-label {
      font-size: .7rem;
      font-weight: 800;
      color: rgba(255,255,255,.5);
      text-transform: uppercase;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .age-stepper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .age-step-btn {
      background: rgba(255,215,0,.18);
      border: 2px solid rgba(255,215,0,.4);
      color: #ffd700;
      font-family: 'Nunito', sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: background .15s, transform .1s;
      padding: 0;
    }

    .age-step-btn:hover  { background: rgba(255,215,0,.38); transform: scale(1.15); }
    .age-step-btn:active { transform: scale(.92); }

    .age-value {
      font-size: 1.7rem;
      font-weight: 900;
      color: #ffd700;
      min-width: 32px;
      text-align: center;
      text-shadow: 0 0 18px rgba(255,215,0,.6);
      animation: age-pulse 2s ease-in-out infinite;
    }

    @keyframes age-pulse {
      0%,100% { text-shadow: 0 0 10px rgba(255,215,0,.4); }
      50%      { text-shadow: 0 0 28px rgba(255,215,0,.9); }
    }

    .logo {
      font-size: clamp(2.8rem, 9vw, 5rem);
      font-weight: 900;
      color: #ffd700;
      letter-spacing: -1px;
      animation: glow 2.5s ease-in-out infinite alternate;
      line-height: 1.1;
    }

    @keyframes glow {
      from { text-shadow: 0 0 20px rgba(255,215,0,.3), 0 0 40px rgba(255,165,0,.2); }
      to   { text-shadow: 0 0 40px rgba(255,215,0,.8), 0 0 80px rgba(255,140,0,.5); }
    }

    .logo-sub {
      font-size: clamp(1rem, 3vw, 1.35rem);
      color: rgba(255,255,255,.75);
      font-weight: 700;
      margin-top: 6px;
    }

    .pick-prompt {
      font-size: clamp(1rem, 2.8vw, 1.2rem);
      color: rgba(255,255,255,.55);
      margin-top: 4px;
      font-weight: 600;
    }

    /* Category grid */
    .categories-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      max-width: 1000px;
      margin: 0 auto;
    }

    @media (min-width: 560px)  { .categories-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 860px)  { .categories-grid { grid-template-columns: repeat(5, 1fr); } }

    .cat-card {
      border-radius: 22px;
      padding: 20px 10px 18px;
      text-align: center;
      cursor: pointer;
      border: 2px solid rgba(255,255,255,.12);
      position: relative;
      overflow: hidden;
      transition: transform .18s ease, box-shadow .18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .cat-card::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
      transition: left .45s ease;
      pointer-events: none;
    }

    .cat-card:hover  { transform: translateY(-5px) scale(1.04); }
    .cat-card:hover::after { left: 130%; }
    .cat-card:active { transform: scale(.96); }

    .cat-emoji {
      font-size: 2.6rem;
      display: block;
      margin-bottom: 7px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.35));
    }

    .cat-name {
      font-size: .9rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,.5);
      line-height: 1.25;
    }

    .cat-sub {
      font-size: .68rem;
      color: rgba(255,255,255,.82);
      font-weight: 700;
      margin-top: 3px;
      line-height: 1.3;
    }

    /* ══════════════════════════════════════════════════
       QUIZ SCREEN
    ══════════════════════════════════════════════════ */
    #screen-quiz { padding: 16px 16px 60px; }

    .quiz-inner {
      max-width: 680px;
      margin: 0 auto;
    }

    /* Header row */
    .quiz-topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .btn-home-q {
      flex-shrink: 0;
      background: rgba(255,255,255,.12);
      border: 2px solid rgba(255,255,255,.25);
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-size: .95rem;
      font-weight: 800;
      padding: 8px 14px;
      border-radius: 50px;
      cursor: pointer;
      transition: background .15s;
      touch-action: manipulation;
    }
    .btn-home-q:hover { background: rgba(255,255,255,.22); }

    .cat-badge {
      flex: 1;
      text-align: center;
      font-size: clamp(.85rem, 2.5vw, 1.05rem);
      font-weight: 800;
      background: rgba(255,255,255,.08);
      border-radius: 50px;
      padding: 8px 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .score-badge {
      flex-shrink: 0;
      font-size: 1rem;
      font-weight: 900;
      color: #ffd700;
      background: rgba(255,215,0,.15);
      border: 2px solid rgba(255,215,0,.4);
      border-radius: 50px;
      padding: 8px 14px;
    }

    /* Progress */
    .progress-area { margin-bottom: 20px; }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: .85rem;
      font-weight: 700;
      color: rgba(255,255,255,.55);
      margin-bottom: 7px;
    }

    .progress-track {
      height: 11px;
      background: rgba(255,255,255,.1);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #ffd700, #ff8c00);
      transition: width .5s cubic-bezier(.4,0,.2,1);
    }

    /* Question card */
    .question-card {
      background: rgba(255,255,255,.07);
      backdrop-filter: blur(18px);
      border: 2px solid rgba(255,255,255,.1);
      border-radius: 22px;
      padding: 24px 20px;
      margin-bottom: 16px;
    }

    .q-label {
      font-size: .78rem;
      font-weight: 800;
      color: rgba(255,255,255,.4);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
    }

    .q-text {
      font-size: clamp(1.1rem, 3.5vw, 1.45rem);
      font-weight: 800;
      line-height: 1.45;
    }

    /* Options */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
      margin-bottom: 16px;
    }

    @media (max-width: 380px) { .options-grid { grid-template-columns: 1fr; } }

    .opt-btn {
      background: rgba(255,255,255,.09);
      border: 2.5px solid rgba(255,255,255,.18);
      border-radius: 16px;
      padding: 15px 11px;
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-size: clamp(.88rem, 2.5vw, 1rem);
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      line-height: 1.35;
      transition: background .15s, border-color .15s, transform .12s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .opt-btn:hover:not(:disabled) {
      background: rgba(255,255,255,.18);
      border-color: rgba(255,255,255,.45);
      transform: translateY(-2px);
    }

    .opt-btn:active:not(:disabled) { transform: scale(.97); }
    .opt-btn:disabled { cursor: default; }

    .opt-btn.correct {
      background: rgba(50,205,50,.28);
      border-color: #32cd32;
      animation: pop-correct .35s ease;
    }

    .opt-btn.wrong {
      background: rgba(255,69,58,.28);
      border-color: #ff453a;
      animation: shake-wrong .38s ease;
    }

    @keyframes pop-correct {
      0%   { transform: scale(1); }
      45%  { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    @keyframes shake-wrong {
      0%,100% { transform: translateX(0); }
      20%     { transform: translateX(-7px); }
      60%     { transform: translateX(7px); }
    }

    /* Feedback card */
    .feedback-card {
      background: rgba(255,255,255,.07);
      border: 2px solid rgba(255,255,255,.12);
      border-radius: 18px;
      padding: 18px 20px;
      display: none;
      animation: fade-up .28s ease;
    }

    .feedback-card.show { display: block; }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .fb-icon   { font-size: 2.2rem; margin-bottom: 4px; }

    .fb-title  {
      font-size: 1.15rem;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .fb-title.ok  { color: #4cde4c; }
    .fb-title.bad { color: #ff6b6b; }

    .fb-fact-label {
      font-size: .75rem;
      font-weight: 800;
      color: #ffd700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 3px;
    }

    .fb-fact {
      font-size: .95rem;
      font-weight: 600;
      color: rgba(255,255,255,.85);
      line-height: 1.55;
    }

    /* ══════════════════════════════════════════════════
       RESULTS SCREEN
    ══════════════════════════════════════════════════ */
    #screen-results.active {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    .results-card {
      background: rgba(255,255,255,.07);
      backdrop-filter: blur(20px);
      border: 2px solid rgba(255,255,255,.13);
      border-radius: 28px;
      padding: 40px 28px;
      text-align: center;
      max-width: 460px;
      width: 100%;
      animation: fade-up .4s ease;
    }

    .res-emoji { font-size: 4.8rem; margin-bottom: 10px; }

    .res-stars {
      font-size: 2.4rem;
      margin-bottom: 14px;
      animation: stars-pop .5s .1s both;
    }

    @keyframes stars-pop {
      0%   { transform: scale(0); opacity: 0; }
      65%  { transform: scale(1.25); }
      100% { transform: scale(1);   opacity: 1; }
    }

    .res-title {
      font-size: clamp(1.5rem, 5vw, 2.1rem);
      font-weight: 900;
      margin-bottom: 10px;
    }

    .res-msg {
      font-size: 1.05rem;
      font-weight: 600;
      color: rgba(255,255,255,.8);
      line-height: 1.55;
      margin-bottom: 20px;
    }

    .score-pill {
      display: inline-block;
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      color: #1a0d00;
      font-size: 1.25rem;
      font-weight: 900;
      padding: 10px 28px;
      border-radius: 50px;
      margin-bottom: 28px;
    }

    .res-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary, .btn-secondary {
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      padding: 13px 22px;
      border-radius: 50px;
      cursor: pointer;
      border: none;
      transition: transform .15s, box-shadow .15s;
      touch-action: manipulation;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      color: #1a0d00;
      box-shadow: 0 4px 20px rgba(255,215,0,.4);
    }

    .btn-secondary {
      background: rgba(255,255,255,.12);
      color: #fff;
      border: 2px solid rgba(255,255,255,.28);
    }

    .btn-primary:hover, .btn-secondary:hover { transform: translateY(-2px); }
    .btn-primary:active, .btn-secondary:active { transform: scale(.97); }

    /* ── Loading overlay ────────────────────────────── */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(11,12,42,.93);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .loading-overlay.hidden { display: none; }

    .loading-spinner {
      width: 56px; height: 56px;
      border: 5px solid rgba(255,215,0,.2);
      border-top-color: #ffd700;
      border-radius: 50%;
      animation: spin .85s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 1.1rem;
      font-weight: 800;
      color: rgba(255,255,255,.85);
      text-align: center;
    }

    /* ── Hint ────────────────────────────────────────── */
    .hint-area { margin-bottom: 14px; text-align: center; }

    .btn-hint {
      background: rgba(255,215,0,.12);
      border: 2px solid rgba(255,215,0,.35);
      color: #ffd700;
      font-family: 'Nunito', sans-serif;
      font-size: .92rem;
      font-weight: 800;
      padding: 9px 22px;
      border-radius: 50px;
      cursor: pointer;
      transition: background .15s, transform .12s;
      touch-action: manipulation;
    }

    .btn-hint:hover:not(:disabled) {
      background: rgba(255,215,0,.22);
      transform: translateY(-2px);
    }

    .btn-hint:disabled { opacity: .5; cursor: default; transform: none; }

    .hint-bubble {
      margin-top: 10px;
      background: rgba(255,215,0,.07);
      border: 2px solid rgba(255,215,0,.22);
      border-radius: 14px;
      padding: 12px 16px;
      font-size: .93rem;
      font-weight: 600;
      color: rgba(255,255,255,.9);
      line-height: 1.55;
      display: none;
      animation: fade-up .25s ease;
    }

    .hint-bubble.show { display: block; }

    /* ══════════════════════════════════════════════════
       AGE SCREEN
    ══════════════════════════════════════════════════ */
    #screen-age.active {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      min-height: 100vh;
    }

    .age-card {
      background: rgba(255,255,255,.07);
      backdrop-filter: blur(20px);
      border: 2px solid rgba(255,255,255,.13);
      border-radius: 28px;
      padding: 40px 28px;
      text-align: center;
      max-width: 460px;
      width: 100%;
      animation: fade-up .35s ease;
    }

    .age-title {
      font-size: clamp(1.4rem, 5vw, 1.9rem);
      font-weight: 900;
      margin-bottom: 8px;
    }

    .age-sub {
      font-size: 1rem;
      font-weight: 600;
      color: rgba(255,255,255,.6);
      margin-bottom: 28px;
    }

    .age-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .age-btn {
      background: rgba(255,255,255,.09);
      border: 2.5px solid rgba(255,255,255,.18);
      border-radius: 16px;
      padding: 18px 8px;
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-size: 1.35rem;
      font-weight: 900;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .12s;
      touch-action: manipulation;
    }

    .age-btn:hover {
      background: rgba(255,215,0,.18);
      border-color: rgba(255,215,0,.6);
      transform: translateY(-3px) scale(1.06);
    }

    .age-btn:active { transform: scale(.96); }

    .age-btn span {
      display: block;
      font-size: .72rem;
      font-weight: 700;
      color: rgba(255,255,255,.55);
      margin-top: 4px;
    }

    .btn-back-age {
      background: rgba(255,255,255,.1);
      border: 2px solid rgba(255,255,255,.22);
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-size: .95rem;
      font-weight: 800;
      padding: 10px 24px;
      border-radius: 50px;
      cursor: pointer;
      transition: background .15s;
    }

    .btn-back-age:hover { background: rgba(255,255,255,.2); }

    /* ── Next button ─────────────────────────────────── */
    .btn-next {
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      border: none;
      color: #1a0d00;
      font-family: 'Nunito', sans-serif;
      font-size: 1.05rem;
      font-weight: 900;
      padding: 13px 32px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255,215,0,.4);
      transition: transform .15s, box-shadow .15s;
      touch-action: manipulation;
      animation: fade-up .25s ease;
    }

    .btn-next:hover  { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(255,215,0,.6); }
    .btn-next:active { transform: scale(.96); }

    /* ── Confetti ────────────────────────────────────── */
    .confetti-bit {
      position: fixed;
      top: -12px;
      pointer-events: none;
      z-index: 999;
      border-radius: 2px;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>

<canvas id="star-canvas"></canvas>

<div id="app">

  <!-- ════════ HOME SCREEN ════════ -->
  <div id="screen-home" class="screen active">
    <header class="home-header">
      <div class="age-widget">
        <span class="age-widget-emoji">🎂</span>
        <span class="age-widget-label">Your Age</span>
        <div class="age-stepper">
          <button class="age-step-btn" id="age-down">−</button>
          <span class="age-value" id="age-display">5</span>
          <button class="age-step-btn" id="age-up">+</button>
        </div>
      </div>
      <div class="logo">⚡ SciSpark</div>
      <p class="logo-sub">The Science Adventure Quiz!</p>
      <p class="pick-prompt">Pick your age and Start your quiz ride 🚀</p>
    </header>
    <div class="categories-grid" id="categories-grid"></div>
  </div>

  <!-- ════════ AGE SCREEN ════════ -->
  <div id="screen-age" class="screen">
    <div class="age-card">
      <div style="font-size:3rem;margin-bottom:12px">🎂</div>
      <h2 class="age-title">How old are you?</h2>
      <p class="age-sub">We'll make the questions just right for you!</p>
      <div class="age-grid" id="age-grid"></div>
      <button class="btn-back-age" onclick="showScreen('home')">← Back</button>
    </div>
  </div>

  <!-- ════════ QUIZ SCREEN ════════ -->
  <div id="screen-quiz" class="screen">
    <div class="quiz-inner">
      <div class="quiz-topbar">
        <button class="btn-home-q" id="btn-back">Home</button>
        <div class="cat-badge" id="cat-badge"></div>
        <div class="score-badge" id="score-badge">0 pts</div>
      </div>

      <div class="progress-area">
        <div class="progress-labels">
          <span id="prog-text">Question 1 of 8</span>
          <span id="prog-pct">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="prog-fill" style="width:0%"></div>
        </div>
      </div>

      <div class="question-card">
        <div class="q-label" id="q-label">Question 1</div>
        <div class="q-text" id="q-text"></div>
      </div>

      <div class="options-grid" id="options-grid"></div>

      <div class="hint-area" id="hint-area">
        <button class="btn-hint" id="btn-hint">💡 Need a hint?</button>
        <div class="hint-bubble" id="hint-bubble"></div>
      </div>

      <div style="text-align:center;margin-bottom:12px;display:none" id="next-btn-area">
        <button class="btn-next" id="btn-next">Next Question ➜</button>
      </div>

      <div class="feedback-card" id="feedback-card">
        <div class="fb-icon" id="fb-icon"></div>
        <div class="fb-title" id="fb-title"></div>
        <div class="fb-fact-label">Fun Fact</div>
        <div class="fb-fact" id="fb-fact"></div>
      </div>
    </div>
  </div>

  <!-- ════════ RESULTS SCREEN ════════ -->
  <div id="screen-results" class="screen">
    <div class="results-card">

function showLoading(show, text) {
  const overlay = document.getElementById('loading-overlay');
  if (text) document.getElementById('loading-text').textContent = text;
  overlay.classList.toggle('hidden', !show);
}

async function fetchAIQuestions(cat) {
  const res = await fetch('/api/questions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: cat.name, subtitle: cat.subtitle, emoji: cat.emoji, age: state.age })
  });
  if (!res.ok) throw new Error('API error');
  const data = await res.json();
  return data.questions;
}

async function fetchHint(question, options) {
  const res = await fetch('/api/hint', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question, options, age: state.age })
  });
  if (!res.ok) throw new Error('API error');
  const data = await res.json();
  return data.hint;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ================================================================
   AGE SCREEN
================================================================ */
const AGE_LABELS = { 4:'4',5:'5',6:'6',7:'7',8:'8',9:'9',10:'10',11:'11',12:'12' };

function renderAge() {
  const grid = document.getElementById('age-grid');
  grid.innerHTML = Object.keys(AGE_LABELS).map(age => `
    <button class="age-btn" onclick="selectAge(${age})">
      ${age}
      <span>yrs old</span>
    </button>
  `).join('');
}

function selectAge(age) {
  state.age = age;
  beginQuiz();
}

/* ================================================================
   HOME SCREEN
================================================================ */
function renderHome() {
  const grid = document.getElementById('categories-grid');
  grid.innerHTML = CATEGORIES.map((cat, i) => `
    <div class="cat-card"
         style="background:${cat.gradient}; box-shadow: 0 8px 28px ${cat.shadow};"
         onclick="startQuiz(${i})"
         tabindex="0"
         role="button"
         onkeydown="if(event.key==='Enter'||event.key===' ') startQuiz(${i})">
      <span class="cat-emoji">${cat.emoji}</span>
      <div class="cat-name">${cat.name}</div>
      <div class="cat-sub">${cat.subtitle}</div>
    </div>
  `).join('');
}

/* ================================================================
   QUIZ
================================================================ */
function startQuiz(catIndex) {
  state.catIndex = catIndex;
  beginQuiz();
}

async function beginQuiz() {
  state.qIndex    = 0;
  state.score     = 0;
  state.answered  = false;
  state.questions = null;

  showScreen('quiz');
  showLoading(true, `✨ Claude is crafting questions for age ${state.age}...`);

  try {
    state.questions = await fetchAIQuestions(CATEGORIES[state.catIndex]);
  } catch (e) {
    console.warn('AI questions unavailable, using built-in questions.');
    state.questions = null;
  }

  showLoading(false);
  renderQuestion();
}

function renderQuestion() {
  const cat       = CATEGORIES[state.catIndex];
  const questions = state.questions || cat.questions;
  const q         = questions[state.qIndex];
  const total     = questions.length;
  const curr      = state.qIndex + 1;

  // Top bar
  document.getElementById('cat-badge').textContent   = `${cat.emoji}  ${cat.name}`;
  document.getElementById('score-badge').textContent = `${state.score} pts`;

  // Progress
  const pct = Math.round(((curr - 1) / total) * 100);
  document.getElementById('prog-text').textContent  = `Question ${curr} of ${total}`;
  document.getElementById('prog-pct').textContent   = `${pct}%`;
  document.getElementById('prog-fill').style.width  = pct + '%';

  // Question
  document.getElementById('q-label').textContent = `QUESTION ${curr}`;
  document.getElementById('q-text').textContent  = q.q;

  // Options
  document.getElementById('options-grid').innerHTML = q.o.map((opt, i) => `
    <button class="opt-btn" onclick="handleAnswer(${i})">${opt}</button>
  `).join('');

  // Hide feedback, next button and reset hint
  document.getElementById('feedback-card').classList.remove('show');
  document.getElementById('next-btn-area').style.display = 'none';
  document.getElementById('hint-bubble').classList.remove('show');
  document.getElementById('hint-bubble').textContent = '';
  const hintBtn = document.getElementById('btn-hint');
  hintBtn.disabled = false;
  hintBtn.textContent = '💡 Need a hint?';

  state.answered = false;
}

function handleAnswer(selectedIndex) {
  if (state.answered) return;
  state.answered = true;

  const cat = CATEGORIES[state.catIndex];
  const q   = cat.questions[state.qIndex];
  const ok  = selectedIndex === q.c;

  // Disable all buttons and hint
  document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
  document.getElementById('btn-hint').disabled = true;

  // Highlight selected button
  const btns = document.querySelectorAll('.opt-btn');
  btns[selectedIndex].classList.add(ok ? 'correct' : 'wrong');
  if (!ok) btns[q.c].classList.add('correct');

  // Update score
  if (ok) state.score += 10;
  document.getElementById('score-badge').textContent = `${state.score} pts`;

  // Show feedback
  const fb        = document.getElementById('feedback-card');
  const fbIcon    = document.getElementById('fb-icon');
  const fbTitle   = document.getElementById('fb-title');
  const fbFact    = document.getElementById('fb-fact');

  if (ok) {
    fbIcon.textContent   = '🎉';
    fbTitle.textContent  = 'Correct! Well done!';
    fbTitle.className    = 'fb-title ok';
  } else {
    fbIcon.textContent   = '🤔';
    fbTitle.textContent  = `Not quite! The answer was: ${q.o[q.c]}`;
    fbTitle.className    = 'fb-title bad';
  }
  fbFact.textContent = q.f;
  fb.classList.add('show');

  // Show Next button
  document.getElementById('next-btn-area').style.display = 'block';
}

/* ================================================================
   RESULTS
================================================================ */
function showResults() {
  const cat       = CATEGORIES[state.catIndex];
  const questions = state.questions || cat.questions;
  const total     = questions.length;
  const correct = state.score / 10;
  const data    = getResultsData(correct, total);

  document.getElementById('res-emoji').textContent = data.emoji;
  document.getElementById('res-stars').textContent = '⭐'.repeat(data.stars) + '☆'.repeat(3 - data.stars);
  document.getElementById('res-title').textContent = data.title;
  document.getElementById('res-msg').textContent   = data.message;
  document.getElementById('res-score').textContent = `${correct} / ${total} correct!`;

  if (data.stars >= 2) launchConfetti();

  showScreen('results');
}

/* ================================================================
   CONFETTI
================================================================ */
function launchConfetti() {
  const colours = ['#ffd700','#ff6b6b','#4ecdc4','#45b7d1','#96e6a1','#f9ca24','#ff9ff3','#a29bfe'];
  for (let i = 0; i < 70; i++) {
    setTimeout(() => {
      const el       = document.createElement('div');
      el.className   = 'confetti-bit';
      const size     = Math.random() * 9 + 5;
      el.style.cssText = `
        left: ${Math.random() * 100}vw;
        width: ${size}px; height: ${size}px;
        background: ${colours[Math.floor(Math.random() * colours.length)]};
        border-radius: ${Math.random() > .5 ? '50%' : '2px'};
        animation-duration: ${Math.random() * 2.2 + 2}s;
      `;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4500);
    }, i * 38);
  }
}

/* ================================================================
   ANIMATED STAR BACKGROUND
================================================================ */
function initStars() {
  const canvas = document.getElementById('star-canvas');
  const ctx    = canvas.getContext('2d');

  const resize = () => { canvas.width = innerWidth; canvas.height = innerHeight; };
  resize();
  window.addEventListener('resize', resize);

  const stars = Array.from({ length: 180 }, () => ({
    x:     Math.random() * innerWidth,
    y:     Math.random() * innerHeight,
    r:     Math.random() * 1.4 + 0.2,
    phase: Math.random() * Math.PI * 2,
    speed: Math.random() * 0.018 + 0.004
  }));

  const draw = t => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      const alpha = 0.15 + 0.65 * Math.abs(Math.sin(s.phase + t * s.speed));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${alpha.toFixed(2)})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
}

/* ================================================================
   BOOT
================================================================ */
document.getElementById('btn-back').addEventListener('click', () => showScreen('home'));

document.getElementById('btn-next').addEventListener('click', () => {
  const questions = state.questions || CATEGORIES[state.catIndex].questions;
  if (state.qIndex + 1 < questions.length) {
    state.qIndex++;
    renderQuestion();
  } else {
    showResults();
  }
});
document.getElementById('btn-again').addEventListener('click', () => beginQuiz());
document.getElementById('btn-home-r').addEventListener('click', () => showScreen('home'));

document.getElementById('btn-hint').addEventListener('click', async () => {
  const btn    = document.getElementById('btn-hint');
  const bubble = document.getElementById('hint-bubble');

  btn.disabled = true;
  btn.textContent = '💭 Thinking...';

  const cat       = CATEGORIES[state.catIndex];
  const questions = state.questions || cat.questions;
  const q         = questions[state.qIndex];

  try {
    const hint = await fetchHint(q.q, q.o);
    bubble.textContent = hint;
    bubble.classList.add('show');
    btn.textContent = '💡 Hint shown';
  } catch (e) {
    bubble.textContent = '🤔 Think about what you already know — you can do it!';
    bubble.classList.add('show');
    btn.textContent = '💡 Need a hint?';
    btn.disabled = false;
  }
});

document.getElementById('age-down').addEventListener('click', () => {
  if (state.age > 4) { state.age--; document.getElementById('age-display').textContent = state.age; }
});
document.getElementById('age-up').addEventListener('click', () => {
  if (state.age < 12) { state.age++; document.getElementById('age-display').textContent = state.age; }
});

renderHome();
renderAge();
initStars();
</script>
</body>
</html>
